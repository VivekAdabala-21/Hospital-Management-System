services:
  mysql:
    image: mysql:8.4
    container_name: mysql-db
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: Admin@123
      MYSQL_DATABASE: hospital

    ports:
      - "3307:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pAdmin@123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  hospital-app:
    build: .
    container_name: hospital-app

    depends_on:
      mysql:
        condition: service_healthy

    restart: on-failure

volumes:
  mysql-data: